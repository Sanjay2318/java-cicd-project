name: 02 - SonarQube Analysis

on:
  workflow_run:
    workflows:
      - "01 - Java Build and Unit Tests"
    types:
      - completed

permissions:
  contents: read

jobs:
  sonarqube-analysis:
    name: SonarQube Code Quality Analysis

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: [self-hosted, Linux, X64, sonar-runner]

    steps:
      - name: Checkout exact commit from Pipeline 1
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Run SonarQube analysis and Quality Gate
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.projectKey=Java-CI-CD-Project \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

      - name: Upload JAR artifact for Pipeline 3
        uses: actions/upload-artifact@v4
        with:
          name: java-app-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7