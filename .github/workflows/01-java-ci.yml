
name: 01 - Java Build and Unit Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build, Verify and Test Java Application
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Verify Maven project structure
      - name: Verify project structure
        run: |
          echo "Checking Maven project structure..."

          test -f pom.xml || exit 1
          test -f src/main/java/com/example/App.java || exit 1
          test -f src/test/java/com/example/AppTest.java || exit 1

          test -d src/main/java || exit 1
          test -d src/test/java || exit 1

          echo "All required files and directories exist!"

      # Step 3: Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 4: Compile application
      - name: Compile Java application
        run: mvn clean compile

      # Step 5: Execute JUnit tests
      - name: Run unit tests
        run: mvn test

      # Step 6: Package application
      - name: Package JAR
        run: mvn package

      # Step 7: Upload generated JAR
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-app-jar
          path: target/*.jar
          if-no-files-found: error
